name: Hex checks
on:
  push:
    paths: ['hex/**', '.github/workflows/hex-checks.yml']
  pull_request:
    paths: ['hex/**', '.github/workflows/hex-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node hex/verify.cjs
      - run: node hex/verify-opening.cjs
