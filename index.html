<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PKUfighter</title>
    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/ui/layout.css">
    <link rel="stylesheet" href="css/ui/panels.css">
    <link rel="stylesheet" href="css/ui/hud.css">
    <link rel="stylesheet" href="css/ui/boss.css">
    <link rel="stylesheet" href="css/responsive/mobile.css">
    <link rel="stylesheet" href="css/responsive/responsive.css">
    <link rel="stylesheet" href="css/ui/achievements.css">
    <link rel="stylesheet" href="css/ui/cards.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="uiOverlay">
            <div class="stats" id="hudStats">
                <div>分数: <span id="score">0</span></div>
                <div>生命: <span id="lives">3</span></div>
                <div>等级: <span id="level">1</span></div>
                <div>皇冠: <span id="crowns">0</span></div>
            </div>

            <div class="shieldIndicator" id="shieldIndicator">盾: 0.0</div>
            <div class="attackIndicator" id="attackIndicator">攻: 0.0</div>
            <div class="cardIndicator" id="cardIndicator">效果卡: 无</div>

            <div id="gameStartPanel" class="uiPanel">
                <div class="uiMeta">PKUer can fly</div>
                <div class="uiTitle">PKUfighter</div>
                <div class="uiText">滑动屏幕控制飞机移动</div>
                <div class="uiStatsBox">
                    <div class="statRow"><span class="statLabel">上次分数</span><span class="statValue" id="lastScoreValue">0</span></div>
                    <div class="statRow"><span class="statLabel">最高分数</span><span class="statValue" id="highScoreValue">0</span></div>
                    <div class="statRow"><span class="statLabel">总皇冠</span><span class="statValue" id="totalCrownsValue">0</span></div>
                </div>
                <button id="startButton" class="uiButton">开始游戏</button>
                <button id="achievementsButton" class="uiButton uiButtonSecondary">成就</button>
            </div>

            <div id="gameOverPanel" class="uiPanel">
                <div class="uiTitle">游戏结束</div>
                <div class="uiText">最终得分</div>
                <div id="finalScore" class="uiScore">0</div>
                <div class="uiText">皇冠数量</div>
                <div id="finalCrowns" class="uiScore">0</div>
                <button id="restartButton" class="uiButton">返回主菜单</button>
            </div>

            <div id="cardPanel" class="uiPanel cardPanel" style="display: none;">
                <div class="uiMeta">Effect Card</div>
                <div class="uiTitle">选择效果卡</div>
                <div class="cardHint" id="cardHint">首次选择免费</div>
                <div class="cardGrid">
                    <button type="button" class="effectCard" data-card="passion">
                        <span class="cardName">激情岁月</span>
                        <span class="cardDesc">敌我攻击速度翻倍</span>
                        <span class="cardBadge">当前效果</span>
                    </button>
                    <button type="button" class="effectCard" data-card="survival">
                        <span class="cardName">生存之道</span>
                        <span class="cardDesc">攻击力减半，每20秒自动获得1点生命</span>
                        <span class="cardBadge">当前效果</span>
                    </button>
                    <button type="button" class="effectCard" data-card="comeback">
                        <span class="cardName">绝地反击</span>
                        <span class="cardDesc">生命为1或2时，攻击力与攻击速度翻倍</span>
                        <span class="cardBadge">当前效果</span>
                    </button>
                    <button type="button" class="effectCard" data-card="peace">
                        <span class="cardName">平安无事</span>
                        <span class="cardDesc">无效果</span>
                        <span class="cardBadge">当前效果</span>
                    </button>
                </div>
            </div>

            <div id="achievementsPanel" class="uiPanel">
                <div class="uiTitle">成就奖励</div>
                <div class="uiText">当前皇冠: <span id="achievementsCrowns">0</span></div>
                <div class="achievementRow" data-ach="autoShield">
                    <div class="achievementTitle">初出茅庐</div>
                    <div class="achievementDesc">每20秒自动护盾</div>
                    <div class="achievementStatus" id="achStatus-autoShield">未解锁</div>
                </div>
                <div class="achievementRow" data-ach="lives">
                    <div class="achievementTitle">小有成就</div>
                    <div class="achievementDesc">开局5条生命</div>
                    <div class="achievementStatus" id="achStatus-lives">未解锁</div>
                </div>
                <div class="achievementRow" data-ach="bullets2">
                    <div class="achievementTitle">渐入佳境</div>
                    <div class="achievementDesc">每次射击2发子弹</div>
                    <div class="achievementStatus" id="achStatus-bullets2">未解锁</div>
                </div>
                <div class="achievementRow" data-ach="firerate">
                    <div class="achievementTitle">锋芒毕露</div>
                    <div class="achievementDesc">射速提升50%</div>
                    <div class="achievementStatus" id="achStatus-firerate">未解锁</div>
                </div>
                <div class="achievementRow" data-ach="bullets3">
                    <div class="achievementTitle">战无不胜</div>
                    <div class="achievementDesc">每次射击3发子弹</div>
                    <div class="achievementStatus" id="achStatus-bullets3">未解锁</div>
                </div>
                <button id="achievementsBackButton" class="uiButton">返回</button>
            </div>

            <div class="bossWarning" id="bossWarning">BOSS来袭!</div>
            <div class="bossHealthBar" id="bossHealthBar">
                <div class="bossHealthFill" id="bossHealthFill"></div>
                <div class="bossHealthText" id="bossHealthText"></div>
            </div>

            <div class="mobileControls">
                <div class="controlArea"></div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
